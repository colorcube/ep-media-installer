[workspace]
resolver = "3"
members = [
    "crates/epmi-core",
    "apps/epmi",
    "apps/epmi-gui",
]
default-members = [
    "crates/epmi-core",
    "apps/epmi",
    "apps/epmi-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/colorcube/ep-media-installer"
rust-version = "1.85"

[workspace.dependencies]
epmi-core = { path = "crates/epmi-core" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
log = "0.4"
egui = { version = "0.31.1", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
png = "0.18"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
